# isp-platform log archive (WP 4.6). Installed as /etc/rsyslog.d/30-isp-archive.conf by logs-setup.sh.
# Everything lands in /var/log/isp-archive/<kind>/<source>/<YYYY-MM-DD>.log (server time, IST dates);
# logs-maint.sh compresses and seals each finished day and prunes after RETENTION_DAYS (3 years).
#   routers/<router-ip>/   syslog from MikroTiks (UDP 514): PPP, system, errors
#   nat/<router-ip>/       NAT translations (MikroTik log-prefix "ISPNAT"): who used which public IP:port
#   radius/<program>/      FreeRADIUS (production, staging)
#   app/<container>/       isp-api, isp-workers, isp-web, isp-mongo, isp-walled-garden (Docker journald driver)
#   host/auth/  host/system/   SSH/sudo logins and everything else on the server
# Times are written by this server (NTP-synced), not taken from the routers' clocks.

global(workDirectory="/var/spool/rsyslog")

template(name="IspLine" type="string"
  string="%timegenerated:::date-rfc3339% %fromhost-ip% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

template(name="IspRouterFile" type="string"
  string="/var/log/isp-archive/routers/%fromhost-ip%/%$year%-%$month%-%$day%.log")
template(name="IspNatFile" type="string"
  string="/var/log/isp-archive/nat/%fromhost-ip%/%$year%-%$month%-%$day%.log")
template(name="IspRadiusFile" type="string"
  string="/var/log/isp-archive/radius/%programname:::secpath-replace%/%$year%-%$month%-%$day%.log")
template(name="IspAppFile" type="string"
  string="/var/log/isp-archive/app/%programname:::secpath-replace%/%$year%-%$month%-%$day%.log")
template(name="IspAuthFile" type="string"
  string="/var/log/isp-archive/host/auth/%$year%-%$month%-%$day%.log")
template(name="IspSystemFile" type="string"
  string="/var/log/isp-archive/host/system/%$year%-%$month%-%$day%.log")

# Ubuntu's rsyslogd drops root (PrivDropToUser syslog), so it cannot chown to root or write into root-owned
# directories. logs-setup.sh makes the archive directories syslog:isp-archive with the setgid bit, so every new
# directory and file inherits group isp-archive (the API container reads NAT files for lookups) without a chown.
$umask 0027

ruleset(name="isp_routers") {
  if ($msg contains "ISPNAT") then {
    action(type="omfile" dynaFile="IspNatFile" template="IspLine" dynaFileCacheSize="200"
           fileCreateMode="0640"
           dirCreateMode="0750"
           asyncWriting="on" flushInterval="5" ioBufferSize="256k" flushOnTXEnd="off")
  } else {
    action(type="omfile" dynaFile="IspRouterFile" template="IspLine" dynaFileCacheSize="200"
           fileCreateMode="0640"
           dirCreateMode="0750")
  }
  stop
}

module(load="imudp")
input(type="imudp" port="514" ruleset="isp_routers" rateLimit.Interval="0")

# Local messages (journald → rsyslog). Archive copies; the stock Ubuntu rules still run afterwards.
# rsyslogd's own messages are never archived: if an archive write fails, its error would match the rule below,
# fail again and loop (16 Nov 2026: /var/log/syslog grew 48 GB in a day). They still reach /var/log/syslog.
if ($programname == "rsyslogd" or $programname startswith "rsyslogd-") then {
  continue
} else if ($programname startswith "freeradius") then {
  action(type="omfile" dynaFile="IspRadiusFile" template="IspLine"
         fileCreateMode="0640"
         dirCreateMode="0750")
} else if ($programname startswith "isp-") then {
  action(type="omfile" dynaFile="IspAppFile" template="IspLine"
         fileCreateMode="0640"
         dirCreateMode="0750")
} else if ($syslogfacility-text == "auth" or $syslogfacility-text == "authpriv") then {
  action(type="omfile" dynaFile="IspAuthFile" template="IspLine"
         fileCreateMode="0640"
         dirCreateMode="0750")
} else {
  action(type="omfile" dynaFile="IspSystemFile" template="IspLine"
         fileCreateMode="0640"
         dirCreateMode="0750")
}
