# isp-platform app stack on the RADIUS host (RADIUS instance: see app-up.sh). Managed by app-up.sh; secrets live in /etc/isp-app (root only).
# RADIUS (FreeRADIUS + PostgreSQL) stays native on the host; this stack only talks to it over TLS.
name: isp

# Container logs go to journald → rsyslog → /var/log/isp-archive/app/<container>/ (kept 3 years, WP 4.6).
# `docker logs` keeps working with this driver.
x-logging: &logging
  driver: journald
  options:
    tag: '{{.Name}}'

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:8.0}
    container_name: isp-mongo
    logging: *logging
    # mongod directly as the image's mongodb user (999), not through docker-entrypoint.sh: its gosu step hangs under
    # Ubuntu 26.04 AppArmor stacking (apparmor_restrict_unprivileged_unconfined). app-up.sh creates the root user.
    user: '999:999'
    entrypoint: ['mongod']
    command: ['--replSet', 'rs-isp', '--keyFile', '/etc/mongo/keyfile', '--bind_ip_all', '--wiredTigerCacheSizeGB', '1']
    volumes:
      - mongo-data:/data/db
      - /etc/isp-app/mongo.keyfile:/etc/mongo/keyfile:ro
    ports:
      - '127.0.0.1:27018:27017'
    networks: [internal]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1536M }
    restart: unless-stopped

  api:
    build:
      context: ../../..
      dockerfile: deploy/ubuntu/app/api.Dockerfile
    image: isp-api:local
    container_name: isp-api
    logging: *logging
    env_file: /etc/isp-app/app.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '4100'
      APP_VERSION: ${APP_VERSION:-dev}
      # Caddy reaches the API over Docker networks; only its X-Forwarded-For is trusted.
      TRUST_PROXY: ${APP_SUBNET:-172.16.0.0/12}
      NAT_ARCHIVE_DIR: /archive/nat
    extra_hosts:
      - '${PG_HOST:-acs-prod}:host-gateway'
    volumes:
      - /etc/isp-radius/tls/ca.crt:/etc/isp/radius-ca.crt:ro
      # NAT log archive, read-only, for "who used this public IP:port" lookups (group isp-archive, gid 2470)
      - /var/log/isp-archive/nat:/archive/nat:ro
      # Disk guard flags (maintenance, pause-heavy), written by deploy/ubuntu/disk/disk-guard.sh
      - /run/isp-guard:/run/isp-guard:ro
      # Private files (KYC, CAF, logos), AES-256-GCM encrypted by the API; used when no FILES_S3_* bucket is set.
      - /var/lib/isp-files:/var/lib/isp-files
    group_add: ['2470']
    networks:
      internal: {}
      acs:
        aliases: [isp-api]
    depends_on:
      mongo: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 768M }
    restart: unless-stopped

  workers:
    build:
      context: ../../..
      dockerfile: deploy/ubuntu/app/workers.Dockerfile
    image: isp-workers:local
    container_name: isp-workers
    logging: *logging
    env_file: /etc/isp-app/app.env
    environment:
      WORKERS_HOST: 0.0.0.0
      WORKERS_PORT: '4101'
      APP_VERSION: ${APP_VERSION:-dev}
    extra_hosts:
      - '${PG_HOST:-acs-prod}:host-gateway'
    volumes:
      - /etc/isp-radius/tls/ca.crt:/etc/isp/radius-ca.crt:ro
      - /run/isp-guard:/run/isp-guard:ro
    networks: [internal]
    depends_on:
      mongo: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
    restart: unless-stopped

  web:
    build:
      context: ../../..
      dockerfile: deploy/ubuntu/app/web.Dockerfile
    image: isp-web:local
    container_name: isp-web
    logging: *logging
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      # Landing page call + WhatsApp buttons, e.g. "+91 98765 43210". Empty hides them (the demo form stays).
      SALES_PHONE: ${SALES_PHONE:-}
      # Where demo-form leads are POSTed as JSON (Slack incoming webhook, Zapier, Make, n8n, Apps Script).
      # Empty or failing: leads are written to `docker logs isp-web` (event landing.lead.undelivered).
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      # Official product site. Every install's landing page canonicalises here; only this host gets a sitemap.
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:-https://new.bharatradius.com}
    volumes:
      - /run/isp-guard:/run/isp-guard:ro
    # Only Caddy talks to it; the browser reaches the API through Caddy on the same origin.
    networks:
      acs:
        aliases: [isp-web]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
    restart: unless-stopped

  walled-garden:
    image: caddy:2-alpine
    container_name: isp-walled-garden
    logging: *logging
    environment:
      PANEL_HOST: ${PANEL_HOST:-new.bharatradius.com}
    volumes:
      - ./walled-garden/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '8089:8089'
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 64M }
    restart: unless-stopped

networks:
  internal: {}
  # Public web entry: the ACS stack's Caddy (acs_default) or our own (edge); app-up.sh sets EDGE_NETWORK.
  acs:
    external: true
    name: ${EDGE_NETWORK:-acs_default}

volumes:
  mongo-data: {}
