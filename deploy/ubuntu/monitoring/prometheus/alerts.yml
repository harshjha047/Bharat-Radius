groups:
  - name: radius
    rules:
      - alert: RadiusDown
        expr: isp_radius_up{instance_name="production"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'FreeRADIUS production is not answering (Status-Server)'
          runbook: docs/runbooks/radius-down.md

      - alert: RadiusStagingDown
        expr: isp_radius_up{instance_name="staging"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'FreeRADIUS staging is not answering'

      - alert: RadiusStatusStale
        expr: time() - node_textfile_mtime_seconds{file=~".*isp_radius.prom"} > 120 or absent(node_textfile_mtime_seconds{file=~".*isp_radius.prom"})
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: 'RADIUS status metrics not updated for 2 minutes (isp-radius-status.timer stopped?)'

      - alert: RadiusDatabaseDown
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'PostgreSQL on the RADIUS host is down: logins go silent, routers fall back'

      - alert: RadiusRejectSpike
        expr: |
          sum(rate(isp_radius_total_access_rejects{instance_name="production"}[5m]))
            > 3 * (sum(avg_over_time(rate(isp_radius_total_access_rejects{instance_name="production"}[5m])[1d:5m])) + 1)
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'Production reject rate more than 3x the daily average'

      - alert: RadiusDroppedRequests
        expr: sum by (instance_name) (rate(isp_radius_total_auth_dropped_requests[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'FreeRADIUS {{ $labels.instance_name }} is dropping auth requests (overloaded)'

      - alert: RadiusLoginSqlSlow
        expr: max(isp_radius_login_sql_mean_ms{fn="check"}) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Mean radius_check() time above 20 ms'

      - alert: RadiusDefaultPartitionUsed
        expr: isp_radius_default_partition_radacct_rows > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: 'Sessions are landing in radacct_default: the partition timer is not running'

  - name: host
    rules:
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} above 80%'

      # 80 % alone fires too late for a runaway log (16 Nov 2026: 48 GB of syslog in a day).
      - alert: DiskFillingFast
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[1h], 6 * 3600) < 0
          and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.5
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} will be full within 6 hours at the current rate (check /var/log/syslog, docker system df)'

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Less than 10% memory available on the RADIUS host'

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.name }} failed'

      - alert: ExporterDown
        expr: up{job=~"node|postgres"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.job }} exporter not reachable'

  - name: app
    rules:
      - alert: AppHealthFailing
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.instance }} health check failing'

      - alert: OutboxStuck
        expr: isp_outbox_oldest_pending_seconds > 300
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Changes have not reached RADIUS for {{ $value | humanizeDuration }} (outbox)'
          runbook: docs/runbooks/outbox.md

      - alert: OutboxNoLeader
        expr: max(isp_outbox_leader) < 1 or absent(isp_outbox_leader)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'No outbox worker is running: router, plan and ISP changes are not reaching RADIUS'
          runbook: docs/runbooks/outbox.md

      - alert: UsageJobStale
        expr: time() - isp_job_last_success_timestamp_seconds{job="usage"} > 2700
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Usage roll-up has not succeeded for 45+ minutes: usage graphs and FUP are behind'
          runbook: docs/runbooks/usage.md

      - alert: WalletFrozen
        expr: isp_wallets_frozen > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: '{{ $value }} wallet(s) frozen: balance does not match the ledger'
          runbook: docs/runbooks/billing.md

      - alert: BillingJobFailing
        expr: isp_job_failing{job=~"postpaid-invoice|postpaid-overdue|reconcile-wallets|gateway-reconcile|notifications"} == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Billing job {{ $labels.job }} is failing'
          runbook: docs/runbooks/billing.md

      - alert: SmsFailing
        expr: isp_sms_failed_24h > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} SMS failed in the last 24 hours'
          runbook: docs/runbooks/billing.md

      # ---- WP 4.9 ----
      - alert: OutboxErrors
        expr: increase(isp_outbox_errors_total[15m]) > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'RADIUS sync keeps failing ({{ $value | humanize }} errors in 15 min); changes retry with backoff'
          runbook: docs/runbooks/outbox.md

      - alert: ReconcileStale
        expr: time() - isp_job_last_success_timestamp_seconds{job="reconcile-wallets"} > 26 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Nightly wallet reconciliation has not succeeded for over 26 hours'
          runbook: docs/runbooks/billing.md

      - alert: WorkerJobFailing
        expr: isp_job_failing{job=~"expired-sweep|imports|expiry-reminders|usage"} == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Worker job {{ $labels.job }} is failing'
          runbook: docs/runbooks/outbox.md

      - alert: ExpiredSweepStale
        expr: time() - isp_job_last_success_timestamp_seconds{job="expired-sweep"} > 1800
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Expired-customer sweep has not succeeded for 30+ minutes: expired customers may stay online'

      - alert: WalledGardenDown
        expr: probe_success{job="blackbox-walled"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Walled garden (:8089) is not redirecting to the pay page: expired customers cannot pay online'
          runbook: docs/runbooks/pay-page.md

  - name: synthetic
    rules:
      - alert: RadiusLoginProbeFailing
        expr: isp_radius_probe_success{instance_name="production"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Synthetic PPPoE login to production RADIUS fails: customers may not be able to connect'
          runbook: docs/runbooks/radius-down.md

      - alert: RadiusStagingLoginProbeFailing
        expr: isp_radius_probe_success{instance_name="staging"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Synthetic login to staging RADIUS fails'

      - alert: RadiusLoginSlow
        expr: isp_radius_probe_seconds{instance_name="production"} > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Production login takes {{ $value | humanizeDuration }} (synthetic probe)'
          runbook: docs/runbooks/radius-down.md

      - alert: RadiusProbeStale
        expr: time() - isp_radius_probe_timestamp_seconds > 300
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: 'Synthetic login probe has not run for 5 minutes (isp-radius-probe.timer)'

  - name: backups
    rules:
      - alert: BackupMissing
        expr: time() - isp_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'No successful {{ $labels.kind }} backup for over 26 hours'
          runbook: docs/runbooks/backups.md

      - alert: BackupNeverRan
        expr: absent(isp_backup_last_success_timestamp_seconds)
        for: 26h
        labels: { severity: warning }
        annotations:
          summary: 'No backup has ever reported success on this host'
          runbook: docs/runbooks/backups.md

  - name: log-archive
    rules:
      - alert: LogArchiveDiskLow
        expr: isp_logarchive_free_bytes / isp_logarchive_size_bytes < 0.15
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: 'Log archive disk {{ $value | humanizePercentage }} free: logs inside the 3-year retention are never deleted, so add storage'
          runbook: docs/runbooks/compliance-logs.md

      - alert: LogArchiveSealStale
        expr: time() - isp_logarchive_last_seal_timestamp_seconds > 26 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Daily log seal has not run for over 26 hours (isp-logs-maint.timer)'
          runbook: docs/runbooks/compliance-logs.md

      - alert: RouterLogsSilent
        expr: time() - isp_logarchive_source_last_write_timestamp_seconds{kind="routers"} > 3 * 3600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'No syslog from router {{ $labels.source }} for over 3 hours'
          runbook: docs/runbooks/compliance-logs.md

      - alert: ClockNotSynced
        expr: node_timex_sync_status == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Server clock is not NTP-synchronised: log timestamps (DoT/CERT-In) and session times may drift'
          runbook: docs/runbooks/compliance-logs.md
