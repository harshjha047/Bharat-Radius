global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['isp-alertmanager:9093']

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels: { host: acs-prod }

  - job_name: postgres
    static_configs:
      - targets: ['host.docker.internal:9187']
        labels: { host: acs-prod }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['isp-alertmanager:9093']

  - job_name: isp-workers
    static_configs:
      - targets: ['isp-workers:4101']

  # Expired customers' web traffic is dst-nat'ed here by routers; probed on the public address like a router would.
  - job_name: blackbox-walled
    metrics_path: /probe
    params: { module: [http_redirect_pay] }
    static_configs:
      - targets: ['http://154.49.142.251:8089/generate_204']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: isp-blackbox:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ['http://isp-api:4100/healthz', 'https://new.bharatradius.com/api/healthz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: isp-blackbox:9115
