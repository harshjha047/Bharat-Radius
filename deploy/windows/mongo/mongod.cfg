# Managed by isp-platform install-base.ps1. Single-member replica set (transactions need a replica set).
systemLog:
  destination: file
  path: C:\isp\mongo\log\mongod.log
  logAppend: true
  logRotate: rename
storage:
  dbPath: C:\isp\mongo\data
  wiredTiger:
    engineConfig:
      cacheSizeGB: 8
net:
  port: 27017
  bindIp: 127.0.0.1
replication:
  replSetName: rs0
  oplogSizeMB: 4096
#SECURITY#security:
#SECURITY#  authorization: enabled
#SECURITY#  keyFile: C:\isp\secrets\mongo.keyfile
