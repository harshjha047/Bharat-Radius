# Managed by isp-platform install-base.ps1. Our own instance (service isp-mongo), separate from the shared MongoDB on 27017.
# Single-member replica set: transactions need one.
systemLog:
  destination: file
  path: C:\isp\mongo\log\mongod.log
  logAppend: true
  logRotate: rename
storage:
  dbPath: C:\isp\mongo\data
  wiredTiger:
    engineConfig:
      cacheSizeGB: 4
net:
  port: __MONGO_PORT__
  bindIp: 127.0.0.1
replication:
  replSetName: __REPLSET__
  oplogSizeMB: 4096
#SECURITY#security:
#SECURITY#  authorization: enabled
#SECURITY#  keyFile: C:\isp\secrets\mongo.keyfile
