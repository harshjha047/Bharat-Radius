# new.bharatradius.com (staging). Included from nginx.conf inside http { }:  include isp/*.conf;
# BharatRadius server blocks are not touched. Certificates: win-acme (docs/runbooks/windows-base.md).

limit_req_zone $binary_remote_addr zone=isp_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=isp_hooks:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=isp_api:10m rate=30r/s;

upstream isp_web { server 127.0.0.1:3000; keepalive 32; }
upstream isp_api { server 127.0.0.1:__API_PORT__; keepalive 32; }

server {
    listen 80;
    server_name new.bharatradius.com;
    location /.well-known/acme-challenge/ { root C:/isp/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;   # nginx >= 1.25.1 (server runs 1.30.2)
    server_name new.bharatradius.com;

    ssl_certificate     C:/isp/tls/new.bharatradius.com-chain.pem;
    ssl_certificate_key C:/isp/tls/new.bharatradius.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:isp_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/healthz { proxy_pass http://isp_api; access_log off; }
    location ~ ^/api/v1/auth/ { limit_req zone=isp_auth burst=5 nodelay; limit_req_status 429; proxy_pass http://isp_api; }
    location /api/ { limit_req zone=isp_api burst=60 nodelay; limit_req_status 429; proxy_pass http://isp_api; }
    location /webhooks/ { limit_req zone=isp_hooks burst=40 nodelay; proxy_pass http://isp_api; }

    location /_next/static/ {
        proxy_pass http://isp_web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / { proxy_pass http://isp_web; }
}

# Walled garden: MikroTik dst-nats expired users' HTTP (any Host) to this port. Captive-portal probes land here too.
server {
    listen 8089 default_server;
    server_name _;
    access_log logs/isp-walled-garden.log;
    location / {
        add_header Cache-Control "no-store" always;
        return 302 https://new.bharatradius.com/pay;
    }
}
