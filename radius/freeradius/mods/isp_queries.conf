# Managed by isp-platform. All decisions live in PostgreSQL functions (radius/sql/100_functions.sql).

sql_user_name = "%{User-Name}"

client_query = "SELECT id, host(nasname), shortname, type, secret, NULL FROM nas"

authorize_check_query = "SELECT id, username, attribute, value, op \
	FROM radius_check('%{Packet-Src-IP-Address}', '%{SQL-User-Name}', '%{Calling-Station-Id}', '$ENV{RADIUS_PW_KEY}')"

authorize_reply_query = "SELECT id, username, attribute, value, op \
	FROM radius_reply('%{Packet-Src-IP-Address}', '%{SQL-User-Name}')"

acct_args = "'%{Packet-Src-IP-Address}', '%{Acct-Unique-Session-Id}', '%{Acct-Session-Id}', '%{SQL-User-Name}', \
	'%{%{integer:Event-Timestamp}:-0}', '%l', '%{%{Acct-Delay-Time}:-0}', '%{%{Acct-Session-Time}:-0}', \
	'%{%{Acct-Input-Octets}:-0}', '%{%{Acct-Input-Gigawords}:-0}', '%{%{Acct-Output-Octets}:-0}', '%{%{Acct-Output-Gigawords}:-0}', \
	'%{NAS-Port-Id}', '%{NAS-Port-Type}', '%{Acct-Authentic}', '%{Connect-Info}', \
	'%{Called-Station-Id}', '%{Calling-Station-Id}', '%{Service-Type}', '%{Framed-Protocol}', \
	'%{Framed-IP-Address}', '%{Framed-IPv6-Address}', '%{Framed-IPv6-Prefix}', '%{Framed-Interface-Id}', '%{Delegated-IPv6-Prefix}', \
	'%{Acct-Terminate-Cause}'"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-none}.query}"

	type {
		accounting-on {
			query = "SELECT radius_acct('accounting-on', '%{Packet-Src-IP-Address}', '', '', '', \
				'%{%{integer:Event-Timestamp}:-0}', '%l', '%{%{Acct-Delay-Time}:-0}', '0', \
				'', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '')"
		}
		accounting-off {
			query = "${..accounting-on.query}"
		}
		start {
			query = "SELECT radius_acct('start', ${....acct_args})"
		}
		interim-update {
			query = "SELECT radius_acct('interim-update', ${....acct_args})"
		}
		stop {
			query = "SELECT radius_acct('stop', ${....acct_args})"
		}
		none {
			query = "SELECT 1"
		}
	}
}

post-auth {
	reference = ".query"
	query = "SELECT radius_log_auth('%{Packet-Src-IP-Address}', '%{SQL-User-Name}', '%{reply:Packet-Type}', \
		'%{control:Tmp-String-0}', '%{Calling-Station-Id}')"
}
