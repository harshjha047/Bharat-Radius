name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        env: { GITLEAKS_VERSION: 8.30.1 }
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get install -y -qq freeradius-utils
      - name: MongoDB replica set (transactions need one)
        run: |
          # 7.0, not 8.0: MongoDB 8.x refuses to start on kernels 6.19-7.0.13 (SERVER-121912), which the runner uses.
          # The API uses no 8.0-only features; staging/production stay on 8.0.
          docker run -d --name mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          up() { docker exec mongo mongosh --quiet --eval "$1" 2>/dev/null; }
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' mongo)" = true ] || { docker logs mongo; exit 1; }
            [ "$(up 'db.adminCommand("ping").ok')" = 1 ] && break
            sleep 1
          done
          up 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}).ok'
          for _ in $(seq 1 30); do [ "$(up 'db.hello().isWritablePrimary')" = true ] && exit 0; sleep 1; done
          docker logs mongo; exit 1
      - name: PostgreSQL 16 with the Radius schema (for the outbox worker)
        run: |
          docker run -d --name pg -p 5433:5432 -e POSTGRES_PASSWORD=ci postgres:16
          for _ in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -p 5433 && break; sleep 1; done
          ADMIN_URL=postgres://postgres:ci@127.0.0.1:5433 bash radius/tests/schema-only.sh radius_ci fr_ci app_ci ci-app-pw
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
        # The panel proxies /api to a local API only in CI/dev; in production Caddy routes /api.
        env: { API_ORIGIN: 'http://127.0.0.1:4100', NEXT_TELEMETRY_DISABLED: 1 }
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web API types match the API (run `pnpm --filter @isp/web gen:api` after API changes)
        run: |
          pnpm --filter @isp/web gen:api
          git diff --exit-code apps/web/openapi.json apps/web/src/lib/api-types.ts
      - name: API integration (auth, tenant isolation) against MongoDB and PostgreSQL
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017/?replicaSet=rs0'
          RADIUS_DB_URL: 'postgres://app_ci:ci-app-pw@127.0.0.1:5433/radius_ci'
          RADIUS_ADMIN_URL: 'postgres://postgres:ci@127.0.0.1:5433/radius_ci'
        run: pnpm --filter @isp/api test:int
      - name: Outbox worker integration (MongoDB → PostgreSQL)
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017/?replicaSet=rs0'
          RADIUS_DB_URL: 'postgres://app_ci:ci-app-pw@127.0.0.1:5433/radius_ci'
          RADIUS_ADMIN_URL: 'postgres://postgres:ci@127.0.0.1:5433/radius_ci'
        run: pnpm --filter @isp/workers test:int
      - name: Panel end-to-end (Chromium → web → API → MongoDB)
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017/isp_e2e?replicaSet=rs0'
          RADIUS_DB_URL: 'postgres://app_ci:ci-app-pw@127.0.0.1:5433/radius_ci'
          NODE_ENV: development
          PUBLIC_BASE_URL: 'http://localhost:3000'
          COOKIE_SECURE: 'false'
          LOG_LEVEL: warn
          E2E_PASSWORD: 'Monsoon-Fibre-42'
        run: |
          export JWT_SIGNING_KEY="$(openssl rand -hex 32)" REFRESH_TOKEN_PEPPER="$(openssl rand -hex 32)"
          export FIELD_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          cli() { node apps/api/dist/cli.js "$@"; }
          cli migrate
          cli create-tenant --slug e2e --name 'E2E Broadband' --legal-name 'E2E Broadband Pvt Ltd' --state-code 09 \
            --city Noida --state 'Uttar Pradesh' --pincode 201301 --line1 '1 Sector 18'
          echo "$E2E_PASSWORD" | cli create-user --tenant e2e --name 'E2E Admin' --email admin@e2e.test --role 'ISP Admin'
          echo "$E2E_PASSWORD" | cli create-user --tenant e2e --name 'E2E Support' --email support@e2e.test --role Support
          node apps/api/dist/main.js > apps/web/api.log 2>&1 &
          (cd apps/web/.next/standalone/apps/web && cp -r ../../../static .next/static && \
            PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../../../web.log 2>&1 &)
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:4100/livez >/dev/null && curl -fs http://127.0.0.1:3000/livez >/dev/null && break; sleep 1; done
          pnpm --filter @isp/web exec playwright install --with-deps chromium
          cd apps/web && node --test --test-concurrency=1 e2e/panel.e2e.mjs
      - name: Panel end-to-end artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: panel-e2e
          path: |
            apps/web/e2e-artifacts
            apps/web/api.log
            apps/web/web.log
          if-no-files-found: ignore
      - name: MongoDB log on failure
        if: failure()
        run: docker logs --tail 200 mongo || true

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning radius/scripts/*.sh radius/tests/*.sh deploy/ubuntu/*.sh deploy/ubuntu/lab/*.sh deploy/ubuntu/backup/*.sh deploy/ubuntu/logs/*.sh deploy/ubuntu/disk/*.sh
      - name: Disk guard levels
        run: bash deploy/ubuntu/disk/test-guard.sh
      - name: rsyslog archive config parses (WP 4.6)
        run: |
          sudo apt-get install -y -qq rsyslog >/dev/null
          sudo groupadd -g 2470 isp-archive
          # Same as logs-setup.sh: install next to Ubuntu's own config and validate the whole thing (AppArmor
          # only lets rsyslogd read /etc/rsyslog*).
          sudo install -m 0644 deploy/ubuntu/logs/rsyslog-isp.conf /etc/rsyslog.d/30-isp-archive.conf
          sudo rsyslogd -N1

  radius:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Free ports used by runner images
        run: sudo systemctl stop postgresql || true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pycryptodome bc
      - name: Install Radius (production + staging)
        run: sudo PG_TLS_HOSTNAME=localhost bash radius/scripts/install.sh all
      - name: Installer is idempotent
        run: sudo PG_TLS_HOSTNAME=localhost bash radius/scripts/install.sh all
      - name: E2E staging
        run: sudo INSTANCE=staging bash radius/tests/e2e.sh
      - name: E2E production incl. database outage
        run: sudo INSTANCE=production DB_OUTAGE_TEST=1 bash radius/tests/e2e.sh
      - name: Load (regression guard; the real target is proven on the Ubuntu VPS, WP 1.9)
        run: sudo INSTANCE=staging USERS=20000 PARALLEL=200 TARGET=1000 bash radius/tests/load.sh
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u freeradius -u freeradius-staging -u 'postgresql*' --no-pager -n 300 || true
          sudo tail -n 100 /var/log/postgresql/*.log || true
