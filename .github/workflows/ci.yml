name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        env: { GITLEAKS_VERSION: 8.30.1 }
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get install -y -qq freeradius-utils
      - name: MongoDB replica set (transactions need one)
        run: |
          # 7.0, not 8.0: MongoDB 8.x refuses to start on kernels 6.19-7.0.13 (SERVER-121912), which the runner uses.
          # The API uses no 8.0-only features; staging/production stay on 8.0.
          docker run -d --name mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          up() { docker exec mongo mongosh --quiet --eval "$1" 2>/dev/null; }
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' mongo)" = true ] || { docker logs mongo; exit 1; }
            [ "$(up 'db.adminCommand("ping").ok')" = 1 ] && break
            sleep 1
          done
          up 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}).ok'
          for _ in $(seq 1 30); do [ "$(up 'db.hello().isWritablePrimary')" = true ] && exit 0; sleep 1; done
          docker logs mongo; exit 1
      - name: PostgreSQL 16 with the RADIUS schema (for the outbox worker)
        run: |
          docker run -d --name pg -p 5433:5432 -e POSTGRES_PASSWORD=ci postgres:16
          for _ in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -p 5433 && break; sleep 1; done
          ADMIN_URL=postgres://postgres:ci@127.0.0.1:5433 bash radius/tests/schema-only.sh radius_ci fr_ci app_ci ci-app-pw
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: API integration (auth, tenant isolation) against MongoDB and PostgreSQL
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017/?replicaSet=rs0'
          RADIUS_DB_URL: 'postgres://app_ci:ci-app-pw@127.0.0.1:5433/radius_ci'
          RADIUS_ADMIN_URL: 'postgres://postgres:ci@127.0.0.1:5433/radius_ci'
        run: pnpm --filter @isp/api test:int
      - name: Outbox worker integration (MongoDB → PostgreSQL)
        env:
          MONGO_URL: 'mongodb://127.0.0.1:27017/?replicaSet=rs0'
          RADIUS_DB_URL: 'postgres://app_ci:ci-app-pw@127.0.0.1:5433/radius_ci'
          RADIUS_ADMIN_URL: 'postgres://postgres:ci@127.0.0.1:5433/radius_ci'
        run: pnpm --filter @isp/workers test:int
      - name: MongoDB log on failure
        if: failure()
        run: docker logs --tail 200 mongo || true

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning radius/scripts/*.sh radius/tests/*.sh deploy/ubuntu/*.sh

  radius:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Free ports used by runner images
        run: sudo systemctl stop postgresql || true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pycryptodome bc
      - name: Install RADIUS (production + staging)
        run: sudo PG_TLS_HOSTNAME=localhost bash radius/scripts/install.sh all
      - name: Installer is idempotent
        run: sudo PG_TLS_HOSTNAME=localhost bash radius/scripts/install.sh all
      - name: E2E staging
        run: sudo INSTANCE=staging bash radius/tests/e2e.sh
      - name: E2E production incl. database outage
        run: sudo INSTANCE=production DB_OUTAGE_TEST=1 bash radius/tests/e2e.sh
      - name: Load (regression guard; the real target is proven on the Ubuntu VPS, WP 1.9)
        run: sudo INSTANCE=staging USERS=20000 PARALLEL=200 TARGET=1000 bash radius/tests/load.sh
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u freeradius -u freeradius-staging -u 'postgresql*' --no-pager -n 300 || true
          sudo tail -n 100 /var/log/postgresql/*.log || true
